name: Publish

# Publishes to npm via Trusted Publishing (OIDC) — no stored token. Runs when you publish a
# GitHub Release, or manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs a recent npm that understands OIDC.
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run build
      - run: npm publish --provenance --access public
